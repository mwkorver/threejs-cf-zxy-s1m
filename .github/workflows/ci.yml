name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: lint · typecheck · test (TS client & infra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            infra/package-lock.json
      # Three separate packages, so three installs. The root holds only eslint
      # + typescript-eslint; without the other two, `tsc` and `vitest` are not
      # on disk and eslint type-checks infra/ against unresolvable aws-cdk-lib
      # imports -- which fails quietly, since the no-unsafe-* rules are off.
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix infra
      - run: npx eslint .
      - run: npm --prefix client run typecheck
      # Vitest runs the core tile math, the LOD/transition logic, the worker
      # pool, and the shared tile-URL routing. No network: tileLoader is mocked.
      - run: npm --prefix client test

  e2e:
    name: playwright (WebGL in a real browser)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      # Chromium only -- the suite declares a single project, and the other
      # browsers are a download this never uses.
      - run: npx playwright install --with-deps chromium
      # What vitest cannot reach: a real WebGL context, tiles actually loading,
      # and renderer.info showing whether GPU resources come back. Tile requests
      # are stubbed in-test, so this is hermetic. The runner has no GPU and
      # rasterises in software, which is why nothing here waits on wall-clock --
      # the tests advance by rendered frames. The one snapshot test skips itself
      # when CI is set: its baseline is a picture of a specific GPU.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  tiler:
    name: ruff · pytest (Python tiler)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The tiler is an installable package (hatchling); -e ".[dev]" pulls in
      # ruff + pytest so CI and a local checkout run the identical tool set.
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      # Every S3/HTTP read is mocked (see tests/), so no AWS credentials and no
      # network are needed — the suite is hermetic.
      - name: pytest
        run: python -m pytest
