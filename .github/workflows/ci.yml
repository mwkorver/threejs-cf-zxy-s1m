name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: lint · typecheck · test (TS client & infra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            infra/package-lock.json
      # Three separate packages, so three installs. The root holds only eslint
      # + typescript-eslint; without the other two, `tsc` and `vitest` are not
      # on disk and eslint type-checks infra/ against unresolvable aws-cdk-lib
      # imports -- which fails quietly, since the no-unsafe-* rules are off.
      - run: npm ci
      - run: npm ci --prefix client
      - run: npm ci --prefix infra
      - run: npx eslint .
      - run: npm --prefix client run typecheck
      # Vitest runs the core tile math, the LOD/transition logic, the worker
      # pool, and the shared tile-URL routing. No network: tileLoader is mocked.
      - run: npm --prefix client test

  tiler:
    name: ruff · pytest (Python tiler)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tiler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # The tiler is an installable package (hatchling); -e ".[dev]" pulls in
      # ruff + pytest so CI and a local checkout run the identical tool set.
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check .
      # Every S3/HTTP read is mocked (see tests/), so no AWS credentials and no
      # network are needed — the suite is hermetic.
      - name: pytest
        run: python -m pytest
