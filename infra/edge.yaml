AWSTemplateFormatVersion: "2010-09-09"
Description: >
  flight-sim edge: one CloudFront distribution, path-routed behaviors
  (plan §3). Phase 0 step 2 scope: /imagery/* and /terrain/* -> tiler
  Function URL via OAC. Static behaviors (/buildings/*, pre-genned pyramid)
  come with Phase 1/2.

Parameters:
  TilerFunctionUrlDomain:
    Type: String
    Description: Host of the tiler Function URL (xxxx.lambda-url.us-west-2.on.aws, no scheme)
  TilerFunctionArn:
    Type: String
    Description: Tiler Lambda ARN (for the invoke permission)
  TileAccessKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Dev access key. When non-empty, a viewer-request CloudFront Function 403s
      any request without ?k=<key>. Passed at deploy time (infra/deploy-edge.sh
      reads the gitignored repo-root .tile-key) so it never lands in the
      template. Empty = open distribution, no function attached.
  StaticBucketName:
    Type: String
    Default: ""
    Description: >
      Optional custom bucket holding pre-genned static assets served straight from S3
      under /footprints/* — e.g. footprints/{s1m,usgs13}.json built by
      tiler/scripts/build_footprints.py. Defaults dynamically to user account bucket
      threejs-cf-zxy-s1m-${AWS::AccountId}-${AWS::Region}.

Conditions:
  HasCustomStaticBucket: !Not [!Equals [!Ref StaticBucketName, ""]]
  CreateAppStaticBucket: !Equals [!Ref StaticBucketName, ""]
  KeyEnabled: !Not [!Equals [!Ref TileAccessKey, ""]]

Resources:
  # Dev gate. MUST run on viewer-request, not at the origin: CloudFront serves
  # cache hits without ever contacting the Lambda, so origin-side auth would
  # leave every already-cached tile open. Runs on hits and misses alike.
  #
  # The key is read from the query string but the cache policy below keeps
  # QueryStringBehavior: none, so it never enters the cache key (all viewers
  # share one cached object) and is never forwarded to the origin. Rotating the
  # key therefore needs no invalidation.
  TileAuthFunction:
    Type: AWS::CloudFront::Function
    Condition: KeyEnabled
    Properties:
      Name: flight-sim-tile-auth
      AutoPublish: true
      FunctionConfig:
        Comment: Require ?k=<key> on every viewer request (dev gate)
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var qs = event.request.querystring;
          if (!qs.k || qs.k.value !== '${TileAccessKey}') {
            return { statusCode: 403, statusDescription: 'Forbidden' };
          }
          return event.request;
        }

  # Path-only cache keys: no query strings, no cookies, no headers
  # (plan §4.1 — this is why year/layer live in the path).
  TileCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: flight-sim-tiles-path-only
        # Origin sends Cache-Control: immutable; these are just guardrails.
        DefaultTTL: 86400
        MinTTL: 60
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingBrotli: false # tiles are already compressed
          EnableAcceptEncodingGzip: false
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  # Tiles are a public read-only API consumed cross-origin by the client
  # (dev server, any future host). CORS is applied at the edge so cached
  # objects carry it too and the origin stays header-free.
  TileCorsPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: flight-sim-tiles-cors
        CorsConfig:
          AccessControlAllowCredentials: false
          AccessControlAllowHeaders: { Items: ["*"] }
          AccessControlAllowMethods: { Items: [GET, HEAD] }
          AccessControlAllowOrigins: { Items: ["*"] }
          AccessControlExposeHeaders: { Items: ["X-DEM-Source"] }
          OriginOverride: true

  TilerOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: flight-sim-tiler-oac
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # OAC for the static-asset S3 origin. SigV4-signs origin requests so the
  # bucket stays private (public access block on) and only this distribution
  # can read footprints/*.
  StaticOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: flight-sim-static-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Account-specific static bucket provisioned dynamically when StaticBucketName is empty.
  AppStaticBucket:
    Type: AWS::S3::Bucket
    Condition: CreateAppStaticBucket
    Properties:
      BucketName: !Sub "threejs-cf-zxy-s1m-${AWS::AccountId}-${AWS::Region}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Scoped read for CloudFront's OAC: only footprints/*, only from this
  # distribution. Not a "public" policy (service principal + SourceArn), so it's
  # allowed despite the bucket's BlockPublicPolicy. The bucket has no other
  # policy, so this stack owns it outright.
  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !If [HasCustomStaticBucket, !Ref StaticBucketName, !Ref AppStaticBucket]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontOACReadFootprints
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !If
              - HasCustomStaticBucket
              - !Sub "arn:aws:s3:::${StaticBucketName}/*"
              - !Sub "arn:aws:s3:::threejs-cf-zxy-s1m-${AWS::AccountId}-${AWS::Region}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # Lets CloudFront (and only this distribution) invoke the IAM-auth Function
  # URL. AWS requires BOTH InvokeFunctionUrl and InvokeFunction for OAC —
  # granting only the former returns 403 Forbidden at the Function URL.
  TilerInvokeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TilerFunctionArn
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  TilerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TilerFunctionArn
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: flight-sim viewer and tile stream
        DefaultRootObject: index.html
        HttpVersion: http2and3 # multiplexing matters for tile storms (§5.3)
        PriceClass: PriceClass_100
        Origins:
          - Id: tiler
            DomainName: !Ref TilerFunctionUrlDomain
            OriginAccessControlId: !GetAtt TilerOAC.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
            # All POPs funnel origin misses through one regional cache, so the
            # tiler sees at most one cold render per tile instead of one per POP
            # (plan §8). Place it in the origin's region (us-west-2).
            OriginShield:
              Enabled: true
              OriginShieldRegion: us-west-2
          # Static footprint files and web app bundle, served straight from S3 (no Lambda).
          - Id: static
            DomainName: !If
              - HasCustomStaticBucket
              - !Sub "${StaticBucketName}.s3.${AWS::Region}.amazonaws.com"
              - !Sub "threejs-cf-zxy-s1m-${AWS::AccountId}-${AWS::Region}.s3.${AWS::Region}.amazonaws.com"
            OriginAccessControlId: !GetAtt StaticOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior: # Default root / serves web viewer application (index.html, JS, CSS)
          TargetOriginId: static
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized managed policy
          AllowedMethods: [GET, HEAD]
          Compress: true
        CacheBehaviors:
          # Dynamic tile endpoints -> Tiler Lambda Function URL origin
          - PathPattern: /imagery/*
            TargetOriginId: tiler
            ViewerProtocolPolicy: https-only
            CachePolicyId: !Ref TileCachePolicy
            ResponseHeadersPolicyId: !Ref TileCorsPolicy
            AllowedMethods: [GET, HEAD]
            Compress: false
            FunctionAssociations: !If
              - KeyEnabled
              - - EventType: viewer-request
                  FunctionARN: !GetAtt TileAuthFunction.FunctionMetadata.FunctionARN
              - !Ref AWS::NoValue
          - PathPattern: /terrain/*
            TargetOriginId: tiler
            ViewerProtocolPolicy: https-only
            CachePolicyId: !Ref TileCachePolicy
            ResponseHeadersPolicyId: !Ref TileCorsPolicy
            AllowedMethods: [GET, HEAD]
            Compress: false
            FunctionAssociations: !If
              - KeyEnabled
              - - EventType: viewer-request
                  FunctionARN: !GetAtt TileAuthFunction.FunctionMetadata.FunctionARN
              - !Ref AWS::NoValue
          - PathPattern: /basemap/*
            TargetOriginId: tiler
            ViewerProtocolPolicy: https-only
            CachePolicyId: !Ref TileCachePolicy
            ResponseHeadersPolicyId: !Ref TileCorsPolicy
            AllowedMethods: [GET, HEAD]
            Compress: false
            FunctionAssociations: !If
              - KeyEnabled
              - - EventType: viewer-request
                  FunctionARN: !GetAtt TileAuthFunction.FunctionMetadata.FunctionARN
              - !Ref AWS::NoValue
          # Static footprint vectors and compiled assets -> S3 origin
          - PathPattern: /footprints/*
            TargetOriginId: static
            ViewerProtocolPolicy: https-only
            CachePolicyId: !Ref TileCachePolicy
            ResponseHeadersPolicyId: !Ref TileCorsPolicy
            AllowedMethods: [GET, HEAD]
            Compress: false
            FunctionAssociations: !If
              - KeyEnabled
              - - EventType: viewer-request
                  FunctionARN: !GetAtt TileAuthFunction.FunctionMetadata.FunctionARN
              - !Ref AWS::NoValue
          - PathPattern: /assets/*
            TargetOriginId: static
            ViewerProtocolPolicy: https-only
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized managed policy
            AllowedMethods: [GET, HEAD]
            Compress: true

Outputs:
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
