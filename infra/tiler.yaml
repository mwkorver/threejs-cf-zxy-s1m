AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  flight-sim tiler: Lambda container behind a Function URL (Phase 0 step 2).
  CloudFront (edge.yaml) is the only intended caller; the Function URL is the
  origin. Image built + pushed by SAM (managed ECR) until foundation.yaml
  owns a dedicated repo.

Resources:
  TilerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerTag: python3.12-tiler
      DockerContext: ../tiler
      Dockerfile: Dockerfile
    Properties:
      PackageType: Image
      Architectures: [arm64] # Graviton: cheaper, builds native on arm64 Macs
      # warp + WebP encode are CPU-bound, and Lambda scales vCPU with memory
      # (1 vCPU at 1769 MB), so 3008 MB buys ~1.7 vCPU. Only pays off with
      # GDAL_NUM_THREADS below; 2 full vCPU would need ~3538 MB.
      MemorySize: 3008
      Timeout: 60 # headroom for cold start + basemap child retries
      # Guarantees the tiler a floor of 100 concurrent slots (blunts fast-low-
      # pass spikes, plan §8) and caps it at 100 — a cost ceiling against a
      # runaway spawning expensive cold Lambdas. Free (reserved, not
      # provisioned); needs account concurrency > 100+10, raised to 1000.
      ReservedConcurrentExecutions: 100
      FunctionUrlConfig:
        AuthType: AWS_IAM # CloudFront OAC signs origin requests
      Environment:
        Variables:
          TILER_LAKE_PATH: "s3://naip-geoparquet-index/manifest-index"
          TILER_S1M_INDEX_PATH: "s3://deckgl-cf-xyz-s1m-us-west-2/manifest-index/s1m/S1M_Products.parquet"
          # GDAL tuning for COG-over-S3 reads. Names verified against the GDAL
          # shipped in the image — an unrecognised key here is silently ignored,
          # so a typo reads as a working knob while doing nothing.
          GDAL_DISABLE_READDIR_ON_OPEN: "EMPTY_DIR" # no LIST per open, just the object
          GDAL_NUM_THREADS: "ALL_CPUS" # warp across the vCPU the memory size buys
          CPL_VSIL_CURL_CHUNK_SIZE: "65536" # min read unit, up from GDAL's 16 KB
          VSI_CACHE: "TRUE" # cache read blocks in memory (25 MB/handle default)
          # Frequently-tweaked knobs — pydantic reads TILER_* (settings.py). These
          # are function config, so they can be changed with a fast config-only
          # `sam deploy` (no image rebuild) or `aws lambda update-function-configuration`
          # (instant). Note: already-cached CloudFront tiles are immutable, so an
          # invalidation is needed to see a change on previously-served tiles.
          TILER_USGS_MIN_ZOOM: "11"
          TILER_S1M_MIN_ZOOM: "15"
          TILER_TILE_SIZE: "512"
      Policies:
        - Statement:
            # Signed source reads (plan §2 row 10, §7). Requester-pays is scoped
            # per-asset in imagery.py to the buckets that need it.
            - Effect: Allow
              Action: ["s3:GetObject"]
              Resource:
                - "arn:aws:s3:::naip-visualization/*"    # NAIP RGB COGs (requester-pays)
                - "arn:aws:s3:::prd-tnm/*"               # S1M terrain COGs
                - "arn:aws:s3:::elevation-tiles-prod/*"  # far-field terrain
                - "arn:aws:s3:::deckgl-cf-xyz-s1m-us-west-2/*"  # own lake (manifest-index)
                - "arn:aws:s3:::naip-geoparquet-index/*"        # canonical NAIP lake index
            - Effect: Allow
              Action: ["s3:ListBucket"]
              Resource:
                - "arn:aws:s3:::deckgl-cf-xyz-s1m-us-west-2"
                - "arn:aws:s3:::naip-geoparquet-index"

Outputs:
  FunctionUrl:
    Value: !GetAtt TilerFunctionUrl.FunctionUrl
  # Consumed by edge.yaml (pass as TilerFunctionUrlDomain / TilerFunctionArn).
  FunctionUrlDomain:
    Value: !Select [2, !Split ["/", !GetAtt TilerFunctionUrl.FunctionUrl]]
  FunctionArn:
    Value: !GetAtt TilerFunction.Arn
