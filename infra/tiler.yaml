AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  flight-sim tiler: Lambda container behind a Function URL (Phase 0 step 2).
  CloudFront (edge.yaml) is the only intended caller; the Function URL is the
  origin. Image built + pushed by SAM (managed ECR) until foundation.yaml
  owns a dedicated repo.

Resources:
  TilerFunction:
    Type: AWS::Serverless::Function
    Metadata:
      DockerTag: python3.12-tiler
      DockerContext: ../tiler
      Dockerfile: Dockerfile
    Properties:
      PackageType: Image
      Architectures: [arm64] # Graviton: cheaper, builds native on arm64 Macs
      MemorySize: 2048 # warp + WebP encode are CPU-bound; tune in Phase 0 step 5
      Timeout: 30
      # Reserved concurrency (plan §8, blunts fast-low-pass spikes) omitted:
      # this account's total concurrency limit is 10, so none can be reserved.
      # Re-add once the limit is raised.
      FunctionUrlConfig:
        AuthType: AWS_IAM # CloudFront OAC signs origin requests
      Environment:
        Variables:
          TILER_LAKE_PATH: !Sub "s3://deckgl-s3-cog-s1m-${AWS::AccountId}-us-west2/lake"
          TILER_S1M_INDEX_PATH: !Sub "s3://deckgl-s3-cog-s1m-${AWS::AccountId}-us-west2/lake/s1m/S1M_Products.parquet"
      Policies:
        - Statement:
            # Requester-pays + public source reads (plan §2 row 10, §7):
            # naip-analytic, prd-tnm, elevation-tiles-prod + own lake bucket.
            # TODO: when lake_path moves to s3://deckgl-cf-xyz-s1m-us-west-2
            # (manifest-index/), add "arn:aws:s3:::deckgl-cf-xyz-s1m-us-west-2/*"
            # to GetObject and the bare bucket ARN to ListBucket below — the
            # tiler can't read the new lake without it.
            - Effect: Allow
              Action: ["s3:GetObject"]
              Resource:
                - "arn:aws:s3:::naip-analytic/*"
                - "arn:aws:s3:::prd-tnm/*"
                - "arn:aws:s3:::elevation-tiles-prod/*"
                - !Sub "arn:aws:s3:::deckgl-s3-cog-s1m-${AWS::AccountId}-us-west2/*"
                # State imagery buckets (public, but explicit beats implicit)
                - "arn:aws:s3:::njogis-imagery/*"
            - Effect: Allow
              Action: ["s3:ListBucket"]
              Resource:
                - !Sub "arn:aws:s3:::deckgl-s3-cog-s1m-${AWS::AccountId}-us-west2"

Outputs:
  FunctionUrl:
    Value: !GetAtt TilerFunctionUrl.FunctionUrl
  # Consumed by edge.yaml (pass as TilerFunctionUrlDomain / TilerFunctionArn).
  FunctionUrlDomain:
    Value: !Select [2, !Split ["/", !GetAtt TilerFunctionUrl.FunctionUrl]]
  FunctionArn:
    Value: !GetAtt TilerFunction.Arn
