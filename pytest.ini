# Root pytest config so `pytest` works from the repo root, not only from tiler/.
#
# Without it, rootdir is the repo and collection descends into infra/cdk.out --
# CDK bundles a copy of tiler/ into every asset directory, so pytest finds a
# dozen test_app.py files sharing one basename and aborts the whole run with
# "import file mismatch". 48 collection errors, none of them a real failure, and
# the real tiler/tests never run.
#
# tiler/pyproject.toml keeps its own [tool.pytest.ini_options] for `cd tiler &&
# pytest`; this only makes the root-level invocation land in the same place.
[pytest]
testpaths = tiler/tests
norecursedirs = infra/cdk.out infra/node_modules client node_modules .venv *.egg-info
