[project]
name = "tiler"
version = "0.0.1"
description = "Thin rio-tiler service: NAIP/state imagery + S1M Terrain-RGB tiles on one EPSG:3857 quadtree (FLIGHT-SIM-PLAN.md §4, §10.4)"
# Pinned to the minor the Lambda base image ships (see tiler/Dockerfile), so a
# venv on another minor -- and therefore a possibly different GDAL/rasterio
# wheel -- is rejected rather than quietly passing tests the deployed runtime
# would not run. `pip install -e .` enforces this (and CI installs with pip);
# note that `uv pip install -e .` does NOT, so uv users must pick 3.12 by hand:
#   uv venv --python 3.12 .venv
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",          # Lambda adapter
    "rio-tiler>=7.0",        # COG reads, mosaic, warp (the actual tiler)
    "duckdb>=1.1",           # in-process lake queries = mosaic resolver
    "numpy>=2.0",
    "pyproj>=3.6",           # 4326<->Albers for S1M index (plan §4.2)
    "shapely>=2.0",          # S1M footprint refine (index has no ST_Intersects)
    "pydantic-settings>=2.6",
    "httpx>=0.28",           # basemap.py: pooled concurrent fetch of USDA cache tiles
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.8,<1",          # lint/format, same tool + rule set as CI
    "uvicorn>=0.32",
    "boto3>=1.35",           # duck.py static-secret fallback (local dev)
    "botocore[crt]>=1.35",   # `aws login` credential provider
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# All Python in this repo lives under tiler/, so ruff is configured here rather
# than at the repo root; CI runs it with working-directory: tiler.
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
  ".git",
  ".pytest_cache",
  ".venv",
  "dist",
  "node_modules",
]

[tool.ruff.lint]
# Deliberately narrow: real errors (E9 syntax/IO) and pyflakes (F undefined
# names, unused imports). Style is left alone so lint failures always mean
# something is actually broken.
select = [
  "E9",
  "F",
]
