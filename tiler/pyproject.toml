[project]
name = "tiler"
version = "0.0.1"
description = "Thin rio-tiler service: NAIP/state imagery + S1M Terrain-RGB tiles on one EPSG:3857 quadtree (FLIGHT-SIM-PLAN.md §4, §10.4)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",          # Lambda adapter
    "rio-tiler>=7.0",        # COG reads, mosaic, warp (the actual tiler)
    "duckdb>=1.1",           # in-process lake queries = mosaic resolver
    "numpy>=2.0",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "uvicorn>=0.32",
    "httpx>=0.28",           # FastAPI test client
    "boto3>=1.35",           # duck.py static-secret fallback (local dev)
    "botocore[crt]>=1.35",   # `aws login` credential provider
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
